<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissGate Core</title>
    <style>
        /* Reset y Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
        }

        /* Contenedor Principal */
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        /* Tipografía Apple-Style */
        .triad {
            font-size: 10px;
            letter-spacing: 4px;
            color: #444;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 200; /* Letra fina estilo Apple */
            letter-spacing: -1px;
            margin-bottom: 5px;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            color: #666;
            margin-bottom: 40px;
        }

        /* Caja de Descripción */
        .description-box {
            margin-bottom: 50px;
            padding: 0 20px;
        }
        
        .desc-title {
            color: #FF0000; /* Rojo Suizo */
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .desc-text {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 300;
        }

        .modules-badge {
            display: inline-block;
            margin-top: 20px;
            border: 1px solid #222;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 9px;
            color: #444;
            letter-spacing: 1px;
        }

        /* Micrófono Pulsante */
        .mic-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: pulse 2s infinite;
        }

        .mic-button {
            width: 60px;
            height: 60px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .mic-button:hover {
            background: #222;
            border-color: #555;
            transform: scale(1.05);
        }

        .mic-icon { font-size: 24px; }

        .voice-hint {
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        /* Botón de Entrada */
        .enter-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
            text-transform: uppercase;
        }
        
        .enter-btn:hover { opacity: 1; }

        /* Animaciones */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Tríada -->
        <div class="triad">NASA • PENTAGON • SWISS</div>
        <h1>SWISSGATE</h1>
        <div class="subtitle">ECOSYSTEM v1.0</div>

        <!-- Descripción -->
        <div class="description-box">
            <div class="desc-title">LA TRÍADA DE PODER</div>
            <p class="desc-text">
                Ingeniería de precisión espacial. Seguridad de grado militar.<br>
                Privacidad bancaria helvética.
            </p>
            <div class="modules-badge">55 MÓDULOS ACTIVOS</div>
        </div>

        <!-- Micrófono -->
        <div class="mic-container">
            <div class="mic-ring"></div>
            <div class="mic-button" onclick="alert('Iniciando reconocimiento de voz Qwen...')">
                <span class="mic-icon">🎙️</span>
            </div>
        </div>
        <div class="voice-hint">TOCA PARA HABLAR CON QWEN-AI</div>

        <!-- Botón Entrada -->
        <button class="enter-btn" onclick="window.location.href='/api/chat'">INICIAR SESIÓN SEGURA</button>
    </div>

</body>
</html>
